# Blueprint do Render para o backend de IA do Fast run.
# Plano FREE: o Render não cobra por este serviço. O serviço "dorme" após ~15 min
# sem uso, e a primeira chamada depois disso demora ~1 min para acordar.
# Mudar o plano (e gerar cobrança) só é possível pelo painel do Render, com
# confirmação sua.
services:
  - type: web
    name: fast-run-plano
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Preenchidos no painel do Render (sync: false = não ficam neste arquivo).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Mesmo valor embutido no APK (--dart-define=PLAN_API_TOKEN).
      - key: APP_TOKEN
        sync: false
      # E-mail de contato mostrado na política de privacidade (/privacidade).
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Teto de gastos com a Claude API, em dólares (veja backend/README.md).
      - key: MONTHLY_BUDGET_USD
        value: "5"
      - key: MAX_PER_HOUR
        value: "20"
      - key: MAX_PER_DAY
        value: "60"
