# Blueprint do Render para o backend de IA do Fast run.
# Plano FREE: o Render não cobra por este serviço. O serviço "dorme" após ~15 min
# sem uso, e a primeira chamada depois disso demora ~1 min para acordar.
# Mudar o plano (e gerar cobrança) só é possível pelo painel do Render, com
# confirmação sua.
services:
  - type: web
    name: fast-run-plano
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Preenchidos no painel do Render (sync: false = não ficam neste arquivo).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Conta de serviço do Firebase (JSON inteiro, numa linha). Liga contas,
      # registro de uso e o painel /admin. Sem ela: modo legado com APP_TOKEN.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Config web do Firebase (pública), para o login do painel /admin.
      - key: FIREBASE_WEB_CONFIG
        sync: false
      # E-mails (separados por vírgula) com acesso ao painel /admin.
      - key: ADMIN_EMAILS
        sync: false
      # Só para o APK antigo (1.0.0), enquanto o Firebase não estiver configurado.
      - key: APP_TOKEN
        sync: false
      # E-mail de contato mostrado na política de privacidade (/privacidade).
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Teto de gastos com a Claude API, em dólares (veja backend/README.md).
      - key: MONTHLY_BUDGET_USD
        value: "5"
      - key: MAX_PER_HOUR
        value: "20"
      - key: MAX_PER_DAY
        value: "60"
      # Planos (gerar + ajustar) por usuário por dia.
      - key: MAX_PER_USER_DAY
        value: "5"
